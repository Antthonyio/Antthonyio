name: Gerar gráficos do perfil

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  graficos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar SVG de linguagens e contribuições
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/gerar-graficos.cjs

      - name: Regerar linguagens (públicos + privados)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/linguagens-manual.cjs

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/langs.svg assets/heatmap.svg
          if git diff --staged --quiet; then
            echo "nada mudou"
          else
            git commit -m "chore: atualizar gráficos do perfil"
            git pull --rebase --autostash origin main
            git push origin main
          fi
