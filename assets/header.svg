<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Antthonyi — desenvolvedor full-stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0910"/>
      <stop offset="0.55" stop-color="#08070b"/>
      <stop offset="1" stop-color="#0d0a14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b14aed"/>
      <stop offset="1" stop-color="#e83e8c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9a6d6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#b14aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b14aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.9" r="0.65">
      <stop offset="0" stop-color="#e83e8c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e83e8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.6" cy="1" r="0.6">
      <stop offset="0" stop-color="#5a3cc8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5a3cc8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#241f33" stroke-width="1" fill="none"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.35"/>
  <rect width="1200" height="340" fill="url(#glow1)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>
  <rect width="1200" height="340" fill="url(#glow3)"/>

  <!-- moldura -->
  <rect x="1" y="1" width="1198" height="338" rx="16" stroke="#241f33" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="6" rx="3" fill="url(#acc)" opacity="0.9"/>

  <!-- status -->
  <g transform="translate(72,64)">
    <rect x="0" y="0" width="234" height="30" rx="15" fill="#b14aed" fill-opacity="0.12" stroke="#b14aed" stroke-opacity="0.45"/>
    <circle cx="20" cy="15" r="4.5" fill="#4ade80"/>
    <text x="34" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" letter-spacing="0.6" fill="#b14aed">disponível para projetos</text>
  </g>

  <!-- nome -->
  <text x="68" y="176" font-family="'Space Grotesk',Segoe UI,sans-serif" font-size="86" font-weight="700" letter-spacing="-4" fill="url(#title)">Antthonyi</text>
  <text x="68" y="176" font-family="'Space Grotesk',Segoe UI,sans-serif" font-size="86" font-weight="700" letter-spacing="-4" fill="#b14aed" opacity="0.25" filter="url(#soft)">Antthonyi</text>

  <!-- linha -->
  <rect x="70" y="200" width="120" height="3" rx="1.5" fill="url(#acc)"/>

  <!-- subtítulo -->
  <text x="70" y="238" font-family="'Space Grotesk',Segoe UI,sans-serif" font-size="20" fill="#b6adc8">Desenvolvedor full-stack · bots para Discord · automações</text>

  <!-- tags -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#8b82a0">
    <g transform="translate(70,268)">
      <rect width="82" height="26" rx="7" fill="#12101a" stroke="#241f33"/>
      <text x="12" y="17.5">TypeScript</text>
    </g>
    <g transform="translate(162,268)">
      <rect width="66" height="26" rx="7" fill="#12101a" stroke="#241f33"/>
      <text x="12" y="17.5">Node.js</text>
    </g>
    <g transform="translate(238,268)">
      <rect width="58" height="26" rx="7" fill="#12101a" stroke="#241f33"/>
      <text x="12" y="17.5">Python</text>
    </g>
    <g transform="translate(306,268)">
      <rect width="64" height="26" rx="7" fill="#12101a" stroke="#241f33"/>
      <text x="12" y="17.5">discord</text>
    </g>
    <g transform="translate(380,268)">
      <rect width="58" height="26" rx="7" fill="#12101a" stroke="#241f33"/>
      <text x="12" y="17.5">FiveM</text>
    </g>
    <g transform="translate(448,268)">
      <rect width="52" height="26" rx="7" fill="#12101a" stroke="#241f33"/>
      <text x="12" y="17.5">Docker</text>
    </g>
  </g>

  <!-- terminal decorativo -->
  <g transform="translate(742,52)">
    <rect width="386" height="236" rx="14" fill="#0d0b12" stroke="#241f33" stroke-width="1.5"/>
    <rect width="386" height="38" rx="14" fill="#181523"/>
    <rect y="24" width="386" height="14" fill="#181523"/>
    <line x1="0" y1="38" x2="386" y2="38" stroke="#241f33"/>
    <circle cx="22" cy="19" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="19" r="5" fill="#febc2e"/>
    <circle cx="58" cy="19" r="5" fill="#28c840"/>
    <text x="82" y="23" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8b82a0">~/perfil.ts</text>

    <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12.5">
      <text x="24" y="72" fill="#8b82a0">// perfil.ts</text>
      <text x="24" y="98" fill="#e83e8c">const</text>
      <text x="76" y="98" fill="#7cc7ff">dev</text>
      <text x="110" y="98" fill="#b6adc8">= {</text>
      <text x="44" y="122" fill="#b14aed">nome</text>
      <text x="92" y="122" fill="#b6adc8">:</text>
      <text x="106" y="122" fill="#7ddba0">"Antthonyi"</text>
      <text x="44" y="146" fill="#b14aed">stack</text>
      <text x="92" y="146" fill="#b6adc8">: [</text>
      <text x="118" y="146" fill="#7ddba0">"TS"</text>
      <text x="152" y="146" fill="#b6adc8">,</text>
      <text x="164" y="146" fill="#7ddba0">"Node"</text>
      <text x="214" y="146" fill="#b6adc8">],</text>
      <text x="44" y="170" fill="#b14aed">foco</text>
      <text x="92" y="170" fill="#b6adc8">:</text>
      <text x="106" y="170" fill="#7ddba0">"bots &amp; automações"</text>
      <text x="44" y="194" fill="#b14aed">jogando</text>
      <text x="112" y="194" fill="#b6adc8">:</text>
      <text x="126" y="194" fill="#7ddba0">"AION 2"</text>
      <text x="24" y="220" fill="#b6adc8">};</text>
      <rect x="54" y="209" width="8" height="15" fill="#b14aed"/>
    </g>
  </g>

  <!-- detalhe de canto -->
  <path d="M1130 300 L1168 300 L1168 262" stroke="url(#acc)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M70 40 L32 40 L32 78" stroke="#241f33" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
